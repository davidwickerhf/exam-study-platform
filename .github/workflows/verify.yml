name: Verify study platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:study:postgres
        env:
          STUDY_TEST_DATABASE_URL: postgres://postgres:fixture@localhost:5432/postgres
      - name: Build and boot the production API container
        run: |
          docker build -f Containerfile -t study-api-check .
          docker run -d --name study-api-check -p 4199:8080 -e PORT=8080 study-api-check
          trap 'docker logs study-api-check; docker rm -f study-api-check' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4199/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
